name: CI/CD backend pipeline
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: [self-hosted, ntnu-runners]
    name: Compile, build, install dependencies and test project
    steps:
      - name: Checkout code from repo that triggered workflow
        uses: actions/checkout@v4

      - name: Setup JDK version and distributor
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }} # creates unique cache key based on the hash of the pom.xml
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with maven
        run: mvn clean verify --batch-mode # responsible for installing, compiling and running tests, all-in-one command
        working-directory: backend

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/ # extracts the test coverage report from this path
          retention-days: 30
      


        
