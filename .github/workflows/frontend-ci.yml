name: CI/CD frontend pipeline
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
jobs:
  build-and-test:
    runs-on: ntnu-runners
    name: Compile, build, install dependencies and test frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run unit/component tests with coverage
        run: npm run test:unit -- --coverage --coverage.thresholds.lines=30 --coverage.thresholds.functions=30 --coverage.thresholds.branches=30 --coverage.thresholds.statements=30

      - name: Run E2E tests with coverage
        run: npx cypress run --component --env coverage=true

      - name: Check E2E coverage threshold
        run: |
          COVERAGE=$(npx nyc report --reporter=text-summary 2>/dev/null | grep "Lines" | awk '{print $3}' | tr -d '%')
          echo "E2E line coverage: $COVERAGE%"
          if [ $(echo "$COVERAGE < 30" | bc -l) -eq 1 ]; then
            echo "E2E coverage $COVERAGE% is below the required 30%"
            exit 1
          fi
