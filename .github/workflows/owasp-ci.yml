name: OWASP Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend-security:
    runs-on: ntnu-runners
    name: Frontend Security Scan (ESLint + Retire.js)
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install security plugins
        run: npm install -D eslint-plugin-security retire

      - name: Run ESLint security scan
        run: |
          npx eslint . --ext .js,.vue \
            --plugin security \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-non-literal-fs-filename: warn' \
            --rule 'security/detect-unsafe-regex: error'
        continue-on-error: false

      - name: Run Retire.js scan
        run: npx retire --path . --severity high
        continue-on-error: false

  backend-security:
    runs-on: ntnu-runners
    name: Backend Security Scan (OWASP Dependency-Check)
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run OWASP Dependency-Check via Maven
        run: mvn dependency-check:check -DfailBuildOnCVSS=7
        continue-on-error: false

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
